name: Enviar Lembrete Discord

on:
  schedule:
    # IMPORTANTE: O horário aqui usa o padrão CRON e o fuso horário UTC (3 horas a mais que o de Brasília).
    # O exemplo abaixo roda TODOS OS DIAS às 12:00 do horário de Brasília (15:00 UTC).
    - cron: '0 15 * * *'

jobs:
  enviar_mensagem:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Webhook
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "⏰ **Atenção @everyone!** Este é o seu lembrete diário automático!"}' \
               "${{ secrets.DISCORD_WEBHOOK }}"
